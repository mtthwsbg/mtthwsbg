name: Profile 3D
on:
  schedule: [{ cron: "0 6 * * *" }]
  workflow_dispatch:
  push: { branches: [main], paths: [.github/workflows/profile-3d.yml] }
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib
          git diff --cached --quiet || git commit -m "Update 3D contribution graph"
          git pull --rebase -q && git push
